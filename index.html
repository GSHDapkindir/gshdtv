<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GSHD CANLI YAYIN</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:14px;background:#090609;color:white;
 font-family:Arial,sans-serif;
 background-image:radial-gradient(ellipse at top left,#650018 0,transparent 55%),radial-gradient(ellipse at bottom right,#5a4700 0,transparent 50%);
}
.main{width:100%;max-width:1000px;text-align:center}
h1{margin:0 0 6px;font-size:30px;font-weight:900;letter-spacing:4px;color:#ffcf00;text-shadow:0 0 15px #ff003c}
.subtitle{font-size:11px;letter-spacing:3px;color:#eee;margin-bottom:18px}
.player{
 position:relative;width:100%;aspect-ratio:16/9;background:#000;
 border:2px solid #ffcf00;border-radius:13px;overflow:hidden;
 box-shadow:0 0 25px #a900354d,0 0 20px #ffcf0020;
}
video{width:100%;height:100%;position:absolute;inset:0;object-fit:fill;background:#000}
.status{font-size:12px;color:#ffcf00;margin:14px 0}
button{
 border:1px solid #ffcf00;border-radius:9px;padding:12px 22px;
 background:linear-gradient(110deg,#a90028,#ed003b);
 color:#fff;font-weight:bold;font-size:13px;margin:4px;cursor:pointer
}
button:active{transform:scale(.97)}
#message{font-size:12px;color:#c8c0c5;line-height:1.5;margin-top:12px}
@media(orientation:landscape) and (max-height:500px){
 body{padding:4px}
 .main{max-width:80vw}
 h1{font-size:20px}
 .subtitle{margin-bottom:5px}
 .player{height:68vh;aspect-ratio:auto}
 .status{margin:5px}
 button{padding:8px 14px}
 #message{margin-top:4px}
}
</style>
</head>
<body>
<div class="main">
 <h1>GSHD</h1>
 <div class="subtitle">SARI KIRMIZI • CANLI YAYIN</div> <div class="player" id="player">
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
 </div> <div class="status" id="status">● YAYIN BAĞLANTISI KURULUYOR</div><button onclick="startPlayer()">▶ YAYINI BAŞLAT</button>
<button onclick="fullscreen()">⛶ TAM EKRAN</button>

 <div id="message">Yayın yükleniyor...</div>
</div><script>
const URL_STREAM="https://ladyboy.ardastream2.cfd//hls/bein1.m3u8";
const video=document.getElementById("video");
const status=document.getElementById("status");
const message=document.getElementById("message");
let hls=null;

function setStatus(s){status.textContent="● "+s}

function startPlayer(){
 if(hls){hls.destroy();hls=null}
 video.pause();
 video.removeAttribute("src");
 video.load();

 if(window.Hls && Hls.isSupported()){
  hls=new Hls({
   enableWorker:true,
   maxBufferLength:20,
   xhrSetup:function(xhr){
    xhr.withCredentials=false;
   }
  });

  hls.on(Hls.Events.ERROR,function(event,data){
   if(!data.fatal)return;
   if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
    setStatus("BAĞLANTI HATASI");
    message.textContent="Sunucuya erişilemiyor. Yayın adresi veya sunucu erişimi kontrol edilmeli.";
   }else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
    hls.recoverMediaError();
   }else{
    setStatus("YAYIN AÇILAMADI");
    message.textContent="Yayın kaynağı HLS akışı sunmuyor olabilir veya erişim engellenmiş olabilir.";
    hls.destroy();hls=null;
   }
  });

  hls.on(Hls.Events.MANIFEST_PARSED,function(){
   setStatus("YAYIN HAZIR");
   message.textContent="Canlı yayın hazır.";
   video.play().catch(()=>setStatus("BAŞLATMAK İÇİN OYNAT TUŞUNA BAS"));
  });

  hls.loadSource(URL_STREAM);
  hls.attachMedia(video);
  setStatus("YAYIN YÜKLENİYOR");

 }else if(video.canPlayType("application/vnd.apple.mpegurl")){
  video.src=URL_STREAM;
  video.play().catch(()=>setStatus("OYNAT TUŞUNA BAS"));
 }else{
  setStatus("TARAYICI DESTEKLEMİYOR");
 }
}

function fullscreen(){
 const p=document.getElementById("player");
 if(document.fullscreenElement){
  document.exitFullscreen();
 }else if(p.requestFullscreen){
  p.requestFullscreen().catch(()=>{});
 }else if(video.webkitEnterFullscreen){
  video.webkitEnterFullscreen();
 }
}

document.getElementById("player").addEventListener("dblclick",fullscreen);
video.addEventListener("playing",()=>setStatus("CANLI YAYIN OYNATILIYOR"));
video.addEventListener("waiting",()=>setStatus("YAYIN YÜKLENİYOR"));
startPlayer();
</script></body>
</html>
