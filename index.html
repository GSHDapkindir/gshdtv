:root {
  --yellow: #ffcf00;

}

* {
  box-sizing: border-box;

}

html, body {
  width: 100%;

body {

.ambient {

.topbar {

  align-items: center;

}

.brand {

  font-weight: 900;

}

.brand span {

}

.live-badge {

  color: var(--yellow);

  font-weight: 800;
  letter-spacing: 1px;
}

.live-dot {

  height: 7px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 12px var(--red);
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  50% { opacity: .35; }
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
}

.screen.active {
  display: flex;
}

/* GERİ SAYIM */

#countdownScreen {
  align-items: center;
  justify-content: center;
  padding: 64px 0 0;
}

.countdown-layout {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* FOTOĞRAF ARTIK TÜM ALANI KAPLAR */

.background-photo {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080000;
}

.background-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
}

.background-photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.64), rgba(0,0,0,.15), rgba(0,0,0,.64)),
    linear-gradient(0deg, rgba(0,0,0,.88), transparent 72%);
}

.countdown-content {

  text-align: center;
}

.eyebrow {
  display: inline-block;

  background: rgba(0,0,0,.55);

.main-title {

.main-title span {
  display: block;

}

.subtitle {

.countdown {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));

  width: min(580px, 100%);
  margin: 0 auto;
}

.time-box {
  min-width: 0;
  padding: clamp(12px, 2.2vw, 22px) 4px;
  border-radius: 13px;

.time-number {

.time-label {

.player-title span {
  color: var(--yellow);
}

.player-actions {
  display: flex;

}

.action-btn {
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid rgba(255,207,0,.55);

  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.action-btn:focus {
  outline: 2px solid var(--yellow);
  outline-offset: 3px;
}

.video-area {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;

}

#player {

  height: 100%;
  object-fit: fill;

}

#player:focus {

}

#playerMessage {

  inset: 0;

  align-items: center;

#playerMessage.visible {

.message-card {

.message-card h2 {

}

.message-card p {

  font-size: 13px;

}

.message-card button {
  border: 0;
  border-radius: 9px;
  padding: 12px 20px;
  background: linear-gradient(90deg, var(--yellow), #ff9e00);
  color: #170000;
  font-weight: 900;
  cursor: pointer;
}

.footer-line {
  flex: 0 0 auto;
  min-height: 26px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 5px 10px;
  background: #080000;
  color: rgba(255,255,255,.55);
  font-size: 10px;
  letter-spacing: 1px;
}

/* YATAY TV */

@media (orientation: landscape) {
  .topbar {
    height: 45px;
    padding: 0 18px;
  }

  #countdownScreen {
    padding: 0;
  }

  .countdown-layout {
    width: 100%;
    height: 100%;
  }

  .background-photo {
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .background-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
  }

  .countdown-content {
    padding: 12px;
  }

  .main-title {
    margin: 10px 0 5px;
    font-size: clamp(30px, 7vh, 58px);
  }

  .subtitle {
    margin: 8px auto 14px;
    font-size: clamp(11px, 2vh, 14px);
  }

  .countdown {
    width: min(500px, 100%);
    gap: 8px;
  }

  .time-box {
    padding: 10px 3px;
  }

  .time-number {
    font-size: clamp(22px, 5vh, 38px);
  }

  .time-label {
    margin-top: 5px;
  }

  .countdown-note {
    margin-top: 10px;
  }

  .player-topbar {
    min-height: 40px;
    padding: 4px 12px;
  }

  .action-btn {
    min-height: 30px;
  }

  .footer-line {
    min-height: 18px;
  }
}

/* DİKEY TELEFON */

@media (max-width: 480px) and (orientation: portrait) {
  .topbar {
    height: 56px;
    padding: 0 12px;
  }

  #countdownScreen {
    padding: 0;
  }

  .countdown-layout {
    height: 100%;
  }

  .countdown-content {
    padding: 16px 10px;
  }

  .main-title {
    letter-spacing: -1px;
  }

  .countdown {
    gap: 5px;
  }

  .time-box {
    border-radius: 9px;
    padding: 13px 2px;
  }

  .time-label {

  .player-topbar {

  }

  .action-btn {

    font-size: 10px;

}

/* KÜÇÜK YATAY EKRAN */

@media (max-height: 420px) and (orientation: landscape) {
  .player-topbar {
    min-height: 32px;
  }

  .footer-line {
    display: none;
  }
}

/* TAM EKRAN */

#playerScreen:fullscreen .player-topbar,
#playerScreen:fullscreen .footer-line {
  display: none;
}

#playerScreen:fullscreen .video-area {
  width: 100%;
  height: 100%;
}

#playerScreen:fullscreen #player {
  width: 100%;
  height: 100%;
  object-fit: fill;
}

</div><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script>
/* ==========================================
   AYARLAR
   ========================================== */

/* M3U8 veya MP4 bağlantını buraya yaz. */
const VIDEO_URL = "https://aktif-q65v.onrender.com/play/bein1feed720p";

/* Türkiye saatiyle yayın başlangıcı. */
const START_TIME = "2026-10-26T21:00:00+03:00";

/* ==========================================
   OYNATICI
   ========================================== */

const countdownScreen = document.getElementById("countdownScreen");
const playerScreen = document.getElementById("playerScreen");
const player = document.getElementById("player");
const playerMessage = document.getElementById("playerMessage");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const countdownNote = document.getElementById("countdownNote");

let hls = null;
let playerConfigured = false;
let playbackRequested = false;

function showMessage(title, text) {
  messageTitle.textContent = title;
  messageText.textContent = text;
  playerMessage.classList.add("visible");
}

function hideMessage() {
  playerMessage.classList.remove("visible");
}

function showPlayer() {
  countdownScreen.classList.remove("active");
  playerScreen.classList.add("active");

  if (!playerConfigured) {
    configurePlayer();
  }
}

function configurePlayer() {
  if (playerConfigured) return;
  playerConfigured = true;

  const url = VIDEO_URL.trim();

  if (
    !url ||
    url === "https://ladyboy.ardastream2.cfd//hls/bein1.m3u8" ||
    url === "VIDEO_LINKINI_BURAYA.mp4"
  ) {
    showMessage(
      "Yayın bağlantısı eklenmedi",
      "HTML içindeki VIDEO_URL alanına M3U8 veya MP4 yayın bağlantını ekle."
    );
    return;
  }

  const isM3U8 = /\.m3u8(?:$|[?#])/i.test(url);

  if (isM3U8) {
    /* Safari ve bazı TV tarayıcılarının yerleşik HLS desteği */
    if (player.canPlayType("application/vnd.apple.mpegurl")) {
      player.src = url;
      player.load();
      return;
    }

    /* Yerleşik HLS desteği yoksa HLS.js */
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30
      });

      hls.attachMedia(player);

      hls.on(Hls.Events.MEDIA_ATTACHED, function () {
        hls.loadSource(url);
      });

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        hideMessage();
        if (playbackRequested) startPlayback();
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        if (!data.fatal) return;

        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          showMessage(
            "Bağlantı hatası",
            "Yayın bağlantısını kontrol et. Sunucuya erişilemiyor olabilir."
          );
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          showMessage(
            "Oynatma hatası",
            "Tarayıcı bu yayını desteklemiyor olabilir."
          );
          hls.destroy();
          hls = null;
        }
      });

      return;
    }

    showMessage(
      "M3U8 desteklenmiyor",
      "Bu tarayıcı HLS oynatmayı desteklemiyor. HLS destekli bir tarayıcı kullan."
    );
    return;
  }

  /* MP4 veya doğrudan video bağlantısı */
  player.src = url;
  player.load();
}

async function startPlayback() {
  playbackRequested = true;

  if (!playerConfigured) {
    configurePlayer();
  }

  if (!player.src && !hls) return;

  try {
    hideMessage();
    await player.play();
  } catch (error) {
    showMessage(
      "Oynatmak için düğmeye bas",
      "Otomatik oynatma engellenmiş olabilir. OYNAT düğmesine bas."
    );
  }
}

/* ==========================================
   GERİ SAYIM
   ========================================== */

function updateCountdown() {
  const target = new Date(START_TIME).getTime();
  const distance = target - Date.now();

  if (distance <= 0) {
    ["days", "hours", "minutes", "seconds"].forEach(function (id) {
      document.getElementById(id).textContent = "00";
    });

    countdownNote.textContent = "Yayın başladı.";
    showPlayer();
    return;
  }

  const days = Math.floor(distance / 86400000);
  const hours = Math.floor((distance % 86400000) / 3600000);
  const minutes = Math.floor((distance % 3600000) / 60000);
  const seconds = Math.floor((distance % 60000) / 1000);

  document.getElementById("days").textContent =
    String(days).padStart(2, "0");

  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");
}

/* ==========================================
   DÜĞMELER
   ========================================== */

document.getElementById("playButton").addEventListener("click", function () {
  startPlayback();
});

document.getElementById("messageButton").addEventListener("click", function () {
  if (hls && hls.startLoad) {
    hls.startLoad();
  }
  startPlayback();
});

document.getElementById("fullscreenButton").addEventListener("click", async function () {
  try {
    if (!document.fullscreenElement) {
      if (playerScreen.requestFullscreen) {
        await playerScreen.requestFullscreen();
      } else if (player.webkitEnterFullscreen) {
        player.webkitEnterFullscreen();
      }
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    try {
      if (player.webkitEnterFullscreen) {
        player.webkitEnterFullscreen();
      }
    } catch (e) {}
  }
});

player.addEventListener("playing", hideMessage);

player.addEventListener("error", function () {
  if (player.error) {
    showMessage(
      "Video oynatılamadı",
      "Yayın bağlantısını ve tarayıcı uyumluluğunu kontrol et."
    );
  }
});

/* TV kumandası ve klavye */
document.addEventListener("keydown", function (event) {
  const key = event.key;

  if (
    key === "MediaPlay" ||
    key === "MediaPlayPause" ||
    key === " "
  ) {
    if (playerScreen.classList.contains("active")) {
      if (player.paused) {
        startPlayback();
      } else {
        player.pause();
      }
      event.preventDefault();
    }
  }

  if (key === "MediaStop" && playerScreen.classList.contains("active")) {
    player.pause();
  }

  if (key === "f" || key === "F") {
    document.getElementById("fullscreenButton").click();
  }
});

/* Başlangıç */
updateCountdown();
setInterval(updateCountdown, 1000);
</script></body>
